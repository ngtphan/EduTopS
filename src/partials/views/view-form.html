<!-- TAB 2: FORM LÊN LỊCH -->
<div id="view_form" class="hidden h-full">
  <div class="max-w-2xl mx-auto space-y-6">
    <div
      class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"
    >
      <div
        class="bg-indigo-50 border-b border-indigo-100 px-5 py-3 flex items-center gap-2"
      >
        <i data-lucide="calendar-plus" class="w-5 h-5 text-indigo-700"></i>
        <div>
          <h2 class="text-[15px] font-bold text-indigo-900">Tạo ca dạy mới</h2>
          <p
            id="scheduleFormRoleHint"
            class="text-[11px] text-indigo-700/80 mt-0.5"
          ></p>
        </div>
      </div>
      <form id="scheduleForm" class="p-4 sm:p-5 space-y-5">
        <div>
          <h3
            class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-3"
          >
            Ca học
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
            <div>
              <label
                for="sch_week"
                class="block text-[13px] font-medium text-slate-700 mb-1"
                >Tuần <span class="text-red-500">*</span></label
              ><input
                type="week"
                id="sch_week"
                required
                class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
              />
            </div>
            <div>
              <label
                for="sch_day"
                class="block text-[13px] font-medium text-slate-700 mb-1"
                >Thứ <span class="text-red-500">*</span></label
              ><select
                id="sch_day"
                required
                class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
              >
                <option value="2">Thứ 2</option>
                <option value="3">Thứ 3</option>
                <option value="4">Thứ 4</option>
                <option value="5">Thứ 5</option>
                <option value="6">Thứ 6</option>
                <option value="7">Thứ 7</option>
                <option value="8">Chủ nhật</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
            <div>
              <label
                for="sch_start"
                class="block text-[13px] font-medium text-slate-700 mb-1"
                >Từ giờ <span class="text-red-500">*</span></label
              ><select
                id="sch_start"
                required
                class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
              ></select>
            </div>
            <div>
              <label
                for="sch_end"
                class="block text-[13px] font-medium text-slate-700 mb-1"
                >Đến giờ <span class="text-red-500">*</span></label
              ><select
                id="sch_end"
                required
                class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
              ></select>
            </div>
          </div>
          <div>
            <label
              for="sch_location"
              class="block text-[13px] font-medium text-slate-700 mb-1"
              >Cơ sở / Phòng <span class="text-red-500">*</span></label
            ><input
              type="text"
              id="sch_location"
              required
              class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
            />
          </div>
        </div>
        <hr class="border-slate-100" />
        <div>
          <h3
            class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-3"
          >
            Nhân sự
          </h3>
          <div class="space-y-3">
            <div>
              <label
                for="sch_classId"
                class="block text-[13px] font-medium text-slate-700 mb-1"
                >Nhóm/Lớp <span class="text-red-500">*</span></label
              >
              <select
                id="sch_classId"
                required
                onchange="window.handleClassSelection()"
                class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-medium text-indigo-700 shadow-inner"
              ></select>
              <div
                id="classMultiSelectHelp"
                class="text-[11px] text-slate-500 mt-1 hidden"
              ></div>
            </div>
            <div
              id="sch_classHint"
              class="bg-indigo-50/50 rounded p-2.5 text-[12px] text-slate-600 hidden border border-indigo-100"
            ></div>
            <div
              id="sch_studentPickerWrap"
              class="hidden rounded-lg border border-slate-200 bg-slate-50/80 p-3 space-y-2"
            >
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="text-[12px] text-slate-700">
                  Học sinh tham gia ca:
                  <span
                    id="sch_selectedStudentsCount"
                    class="font-bold text-slate-900"
                    >0</span
                  >/<span
                    id="sch_totalStudentsCount"
                    class="font-bold text-slate-900"
                    >0</span
                  >
                </div>
                <button
                  id="sch_studentCardsToggleBtn"
                  type="button"
                  class="px-2 py-1 text-[11px] font-semibold rounded border border-indigo-200 text-indigo-700 bg-white hover:bg-indigo-50"
                  aria-expanded="false"
                >
                  Hiện danh sách
                </button>
              </div>
              <div id="sch_studentCardsBody" class="hidden space-y-2">
                <div class="flex items-center gap-1.5">
                  <button
                    type="button"
                    onclick="window.updateScheduleStudentSelection('all')"
                    class="px-2 py-1 text-[11px] font-semibold rounded border border-slate-300 text-slate-700 hover:bg-white"
                  >
                    Chọn tất cả
                  </button>
                  <button
                    type="button"
                    onclick="window.updateScheduleStudentSelection('none')"
                    class="px-2 py-1 text-[11px] font-semibold rounded border border-slate-300 text-slate-700 hover:bg-white"
                  >
                    Bỏ tất cả
                  </button>
                </div>
                <div
                  id="sch_studentCheckboxes"
                  class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-52 overflow-auto pr-1"
                ></div>
              </div>
            </div>

            <div>
              <label
                for="sch_subjectId"
                class="block text-[13px] font-medium text-slate-700 mb-1"
                >Môn học <span class="text-red-500">*</span></label
              >
              <select
                id="sch_subjectId"
                required
                onchange="window.handleClassSelection()"
                class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white"
              >
                <option value="">-- Chọn môn học --</option>
              </select>
            </div>
            <div>
              <label
                for="sch_teacherId"
                class="block text-[13px] font-medium text-slate-700 mb-1 flex justify-between items-center"
              >
                <span>Giáo viên <span class="text-red-500">*</span></span>
                <span
                  id="teacherFilterHint"
                  class="text-[10px] text-emerald-600 font-bold hidden bg-emerald-50 px-2 py-0.5 rounded"
                ></span>
              </label>
              <div
                id="sch_teacherCardsWrap"
                class="hidden rounded-lg border border-slate-200 bg-slate-50/80 p-3 space-y-2"
              >
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="text-[12px] text-slate-700">
                    Giáo viên tham gia ca:
                    <span
                      id="sch_selectedTeachersCount"
                      class="font-bold text-slate-900"
                      >0</span
                    >/<span
                      id="sch_totalTeachersCount"
                      class="font-bold text-slate-900"
                      >0</span
                    >
                  </div>
                  <div class="flex items-center gap-2">
                    <div
                      id="sch_teacherCardsModeHint"
                      class="text-[11px] text-indigo-700 font-medium"
                    ></div>
                    <button
                      id="sch_teacherCardsToggleBtn"
                      type="button"
                      class="px-2 py-1 text-[11px] font-semibold rounded border border-indigo-200 text-indigo-700 bg-white hover:bg-indigo-50"
                      aria-expanded="false"
                    >
                      Hiện danh sách
                    </button>
                  </div>
                </div>
                <div
                  id="sch_teacherCards"
                  class="hidden grid grid-cols-1 sm:grid-cols-2 gap-2"
                ></div>
              </div>
              <select
                id="sch_teacherId"
                required
                multiple
                disabled
                class="hidden"
              >
                <option value="">-- Vui lòng chọn Lớp trước --</option>
              </select>
              <div
                id="teacherMultiSelectHelp"
                class="text-[11px] text-slate-500 mt-1"
              ></div>
            </div>
            <details
              class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2"
            >
              <summary
                class="list-none cursor-pointer text-[12px] font-bold text-slate-700 inline-flex items-center gap-1.5"
              >
                <i
                  data-lucide="sliders-horizontal"
                  class="w-3.5 h-3.5 text-slate-400"
                ></i>
                Tùy chọn
              </summary>
              <div class="mt-2">
                <label
                  for="sch_topic"
                  class="block text-[13px] font-medium text-slate-700 mb-1"
                  >Nội dung bài học</label
                ><input
                  type="text"
                  id="sch_topic"
                  class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white"
                />
              </div>
            </details>
          </div>
        </div>
        <button
          type="submit"
          id="btnSubmitSchedule"
          class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-md text-sm"
        >
          <i data-lucide="cloud-upload" class="w-4 h-4"></i> Lưu lên Cloud
        </button>
      </form>
    </div>
  </div>
</div>
