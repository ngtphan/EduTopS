<!-- TAB 4: CHẤM CÔNG -->
<div id="view_attendance" class="ops-admin-view hidden h-full">
  <div
    class="ops-admin-shell max-w-6xl mx-auto h-[calc(100dvh-11.5rem)] sm:h-[calc(100vh-12rem)] min-h-[420px] sm:min-h-[560px]"
  >
    <div
      class="ops-admin-panel bg-white rounded-xl shadow-sm border border-slate-200 p-2 sm:p-3 h-full min-h-0 overflow-hidden"
    >
      <div class="ops-workspace h-full min-h-0">
        <aside class="ops-workspace-rail min-h-0 ops-attendance-rail">
          <section
            class="ops-admin-sidebar-card ops-attendance-rail-head rounded-xl border border-slate-200 bg-white p-3 space-y-1"
          >
            <h2 class="text-base font-bold text-slate-800">
              Chấm công giáo viên
            </h2>
            <p class="text-xs text-slate-500">
              Quét QR để gửi giờ vào/ra, admin duyệt.
            </p>
          </section>

          <section
            class="ops-admin-sidebar-card ops-attendance-rail-period rounded-xl border border-slate-200 bg-white p-3 space-y-2"
          >
            <div
              class="text-[11px] font-bold uppercase text-slate-600 ops-attendance-rail-label"
            >
              Kỳ thống kê
            </div>
            <div
              class="ops-attendance-period-controls flex flex-wrap items-center gap-2 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200"
            >
              <i data-lucide="filter" class="w-4 h-4 text-slate-400"></i>
              <select
                id="attendancePeriod"
                class="text-xs font-bold bg-white border border-slate-200 rounded px-2 py-1 text-slate-700"
              >
                <option value="day">Theo ngày</option>
                <option value="week">Theo tuần</option>
                <option value="month">Theo tháng</option>
              </select>
              <div id="attendanceDateWrap" class="flex items-center">
                <input
                  type="date"
                  id="attendanceDate"
                  class="text-sm bg-transparent focus:outline-none font-bold text-indigo-700 cursor-pointer"
                />
              </div>
              <div id="attendanceWeekWrap" class="hidden items-center">
                <input
                  type="week"
                  id="attendanceWeek"
                  class="text-sm bg-transparent focus:outline-none font-bold text-indigo-700 cursor-pointer"
                />
              </div>
              <div id="attendanceMonthWrap" class="hidden items-center">
                <input
                  type="month"
                  id="attendanceMonth"
                  class="text-sm bg-transparent focus:outline-none font-bold text-indigo-700 cursor-pointer"
                />
              </div>
            </div>
          </section>

          <section
            class="ops-admin-sidebar-card ops-attendance-rail-actions rounded-xl border border-slate-200 bg-white p-3 space-y-2"
          >
            <div
              class="text-[11px] font-bold uppercase text-slate-600 ops-attendance-rail-label"
            >
              Tác vụ nhanh
            </div>
            <button
              onclick="window.exportAttendanceExcel()"
              class="ops-attendance-rail-action w-full text-xs font-bold px-3 py-2 rounded-lg border border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 flex items-center justify-center gap-1.5"
            >
              <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>
              Xuất chấm công
            </button>
            <button
              onclick="window.exportMasterExcel()"
              class="ops-attendance-rail-action w-full text-xs font-bold px-3 py-2 rounded-lg border border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 flex items-center justify-center gap-1.5"
            >
              <i data-lucide="download" class="w-3.5 h-3.5"></i>
              Xuất tổng hợp
            </button>
            <button
              onclick="globalThis.openAttendanceQrAdminModal()"
              data-role-display="inline-flex"
              class="admin-only hidden ops-attendance-rail-action w-full text-xs font-bold px-3 py-2 rounded-lg border border-cyan-200 bg-cyan-50 text-cyan-700 hover:bg-cyan-100 items-center justify-center gap-1.5"
            >
              <i data-lucide="qr-code" class="w-3.5 h-3.5"></i>
              Quản lý mã QR
            </button>
          </section>
        </aside>

        <section class="ops-workspace-main min-h-0">
          <div
            class="h-full min-h-0 rounded-xl border border-slate-200 bg-white overflow-hidden flex flex-col"
          >
            <div
              class="px-3 sm:px-4 py-2 border-b border-slate-200 bg-slate-50/70"
            >
              <div
                id="attendancePeriodLabel"
                class="text-xs font-bold text-slate-600"
              >
                Kỳ thống kê: Ngày
              </div>
            </div>

            <div
              class="ops-admin-scroll flex-1 min-h-0 overflow-y-auto custom-scrollbar p-3 sm:p-4 bg-slate-50/70 space-y-3"
            >
              <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-5 gap-2">
                <div
                  class="rounded-lg border border-slate-200 bg-white px-3 py-2"
                >
                  <div class="text-[10px] font-bold uppercase text-slate-500">
                    Tổng bản ghi
                  </div>
                  <div
                    id="attendanceStatSessions"
                    class="text-base font-bold text-slate-900"
                  >
                    0
                  </div>
                </div>
                <div
                  class="rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2"
                >
                  <div class="text-[10px] font-bold uppercase text-emerald-700">
                    Đã duyệt
                  </div>
                  <div
                    id="attendanceStatPresent"
                    class="text-base font-bold text-emerald-900"
                  >
                    0
                  </div>
                </div>
                <div
                  class="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2"
                >
                  <div class="text-[10px] font-bold uppercase text-rose-700">
                    Từ chối
                  </div>
                  <div
                    id="attendanceStatAbsent"
                    class="text-base font-bold text-rose-900"
                  >
                    0
                  </div>
                </div>
                <div
                  class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2"
                >
                  <div class="text-[10px] font-bold uppercase text-amber-700">
                    Chờ duyệt
                  </div>
                  <div
                    id="attendanceStatPending"
                    class="text-base font-bold text-amber-900"
                  >
                    0
                  </div>
                </div>
                <div
                  class="rounded-lg border border-cyan-200 bg-cyan-50 px-3 py-2"
                >
                  <div class="text-[10px] font-bold uppercase text-cyan-700">
                    Tỉ lệ duyệt
                  </div>
                  <div
                    id="attendanceStatRate"
                    class="text-base font-bold text-cyan-900"
                  >
                    0%
                  </div>
                </div>
              </div>

              <div
                id="attendanceWeeklyPanel"
                data-role-display="block"
                class="admin-only hidden ops-admin-sidebar-card bg-white rounded-xl shadow-sm border border-slate-200 p-3"
              >
                <div
                  class="flex flex-col md:flex-row md:items-center md:justify-between gap-2"
                >
                  <div>
                    <h3 class="text-sm font-bold text-slate-800">
                      Thống kê tuần
                    </h3>
                    <p
                      id="attendanceWeeklyLabel"
                      class="text-[11px] text-slate-500"
                    >
                      Tuần --
                    </p>
                  </div>
                  <div class="grid grid-cols-3 gap-2 text-[11px]">
                    <div
                      class="rounded-lg border border-slate-200 bg-slate-50 px-2 py-1.5"
                    >
                      <div class="font-bold text-slate-700">Bản ghi</div>
                      <div
                        id="attendanceWeeklyTotal"
                        class="text-sm font-bold text-slate-900"
                      >
                        0
                      </div>
                    </div>
                    <div
                      class="rounded-lg border border-emerald-200 bg-emerald-50 px-2 py-1.5"
                    >
                      <div class="font-bold text-emerald-700">Đã duyệt</div>
                      <div
                        id="attendanceWeeklyApproved"
                        class="text-sm font-bold text-emerald-900"
                      >
                        0
                      </div>
                    </div>
                    <div
                      class="rounded-lg border border-cyan-200 bg-cyan-50 px-2 py-1.5"
                    >
                      <div class="font-bold text-cyan-700">Tỉ lệ</div>
                      <div
                        id="attendanceWeeklyRate"
                        class="text-sm font-bold text-cyan-900"
                      >
                        0%
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div
                id="attendanceApprovalPanel"
                class="hidden ops-admin-sidebar-card bg-amber-50 border border-amber-200 rounded-xl p-3"
              >
                <div class="flex items-center justify-between gap-2">
                  <div>
                    <h3 class="text-sm font-bold text-amber-900">
                      Yêu cầu chờ duyệt
                    </h3>
                    <p
                      class="text-[11px] text-amber-800/80"
                      id="attendanceApprovalSummary"
                    >
                      Chờ xử lý.
                    </p>
                  </div>
                  <span
                    id="attendanceApprovalBadge"
                    class="text-[11px] font-bold px-2 py-1 rounded border border-amber-300 bg-white text-amber-800"
                    >0</span
                  >
                </div>
                <div
                  id="attendanceApprovalList"
                  class="mt-2 space-y-2 max-h-52 overflow-y-auto custom-scrollbar"
                ></div>
              </div>

              <div
                class="rounded-xl border border-slate-200 bg-white overflow-hidden min-h-[280px]"
              >
                <div
                  id="attendanceList"
                  class="ops-admin-scroll p-3 sm:p-4 space-y-2 min-h-[280px] max-h-[calc(100dvh-20rem)] sm:max-h-[calc(100vh-22rem)] overflow-y-auto custom-scrollbar bg-slate-50/70"
                ></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
