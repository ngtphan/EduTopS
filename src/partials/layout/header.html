<!-- HEADER -->
    <header
      class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm shrink-0"
    >
      <div
        class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div class="bg-indigo-600 p-2 rounded-lg shadow-sm">
            <i data-lucide="database" class="w-5 h-5 text-white"></i>
          </div>
          <div>
            <h1
              class="text-xl font-bold text-slate-900 tracking-tight leading-none"
            >
              EduTops ERP
            </h1>
            <span
              id="headerRoleBadge"
              class="text-[10px] font-bold uppercase tracking-wider text-slate-500 bg-slate-100 px-2 py-0.5 rounded border border-slate-200 mt-1 inline-block"
              >Đang xác thực...</span
            >
          </div>
        </div>

        <div class="flex items-center gap-4">
          <div
            class="hidden sm:flex items-center gap-2 text-sm font-medium text-slate-600 border-r border-slate-200 pr-4"
          >
            <div
              class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"
            ></div>
            <span class="text-xs text-emerald-600 font-bold mr-2">Online</span>
            <span id="headerUserName">...</span>
          </div>
          <button
            onclick="window.logoutFirebase()"
            class="text-slate-500 hover:text-red-600 transition-colors flex items-center gap-1.5 text-sm font-medium"
          >
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Đăng xuất</span>
          </button>
        </div>
      </div>

      <div
        class="bg-slate-50/90 backdrop-blur-md border-b border-slate-200"
        id="navTabsContainer"
      >
        <div
          class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 flex gap-6 overflow-x-auto hide-scroll"
        >
          <button
            onclick="window.switchTab('board')"
            id="tabBtn_board"
            class="py-3 px-2 border-b-2 border-indigo-600 text-indigo-700 font-bold text-sm flex items-center gap-2 transition-colors whitespace-nowrap"
          >
            <i data-lucide="calendar" class="w-4 h-4"></i> 1. Lịch giảng dạy
          </button>
          <button
            onclick="window.switchTab('form')"
            id="tabBtn_form"
            class="py-3 px-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 font-medium text-sm flex items-center gap-2 transition-colors whitespace-nowrap admin-only hidden"
          >
            <i data-lucide="calendar-plus" class="w-4 h-4"></i> 2. Xếp lịch mới
          </button>
          <button
            onclick="window.switchTab('master')"
            id="tabBtn_master"
            class="py-3 px-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 font-medium text-sm flex items-center gap-2 transition-colors whitespace-nowrap admin-only hidden"
          >
            <i data-lucide="layers" class="w-4 h-4"></i> 3. Quản lý Dữ liệu
          </button>
          <button
            onclick="window.switchTab('attendance')"
            id="tabBtn_attendance"
            class="py-3 px-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 font-medium text-sm flex items-center gap-2 transition-colors whitespace-nowrap admin-only hidden"
          >
            <i data-lucide="badge-dollar-sign" class="w-4 h-4"></i> 4. Chấm công
          </button>
        </div>
      </div>
    </header>
