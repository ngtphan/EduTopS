<!-- Dialog xác nhận thay cho confirm mặc định -->
<div
  id="appDialog"
  class="fixed inset-0 z-[160] hidden items-center justify-center p-3 sm:p-4 bg-slate-900/50"
>
  <div
    class="bg-white w-full max-w-sm rounded-2xl border border-slate-200 shadow-2xl p-4 sm:p-5 max-h-[92dvh] overflow-y-auto custom-scrollbar"
  >
    <h3 id="appDialogTitle" class="text-base font-bold text-slate-800">
      Xác nhận thao tác
    </h3>
    <p
      id="appDialogMessage"
      class="text-sm text-slate-600 mt-2 leading-relaxed"
    >
      Bạn có chắc chắn muốn thực hiện thao tác này?
    </p>
    <div id="appDialogInputWrap" class="mt-3 hidden">
      <input
        id="appDialogInput"
        type="text"
        class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500"
      />
    </div>
    <div id="appDialogSelectWrap" class="mt-3 hidden">
      <select
        id="appDialogSelect"
        class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500"
      ></select>
    </div>
    <div
      class="flex flex-col-reverse sm:flex-row items-stretch sm:items-center justify-end gap-2 mt-5"
    >
      <button
        id="appDialogCancel"
        class="w-full sm:w-auto px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium"
      >
        Hủy
      </button>
      <button
        id="appDialogConfirm"
        class="w-full sm:w-auto px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold"
      >
        Đồng ý
      </button>
    </div>
  </div>
</div>
