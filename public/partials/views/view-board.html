<!-- TAB 1: BOARD -->
<div id="view_board" class="ops-admin-view block h-full">
  <div
    class="ops-admin-shell max-w-6xl mx-auto flex flex-col h-[calc(100dvh-11.5rem)] sm:h-[calc(100vh-12rem)] min-h-[420px] sm:min-h-[500px]"
  >
    <div
      class="ops-admin-panel bg-white rounded-xl shadow-sm border border-slate-200 p-2 sm:p-3 flex-1 min-h-0 overflow-hidden"
    >
      <div class="ops-workspace h-full min-h-0">
        <aside class="ops-workspace-rail min-h-0 ops-board-rail">
          <div class="ops-admin-sidebar-card ops-board-rail-head rounded-xl border border-slate-200 bg-white p-3 space-y-1">
            <h2 class="text-base font-bold text-slate-800" id="boardTitle">
              Lịch giảng dạy
            </h2>
            <p class="text-xs text-slate-500" id="boardSubtitle">
              Đồng bộ Cloud
            </p>
          </div>

          <div class="ops-admin-sidebar-card ops-board-rail-controls rounded-xl border border-slate-200 bg-white p-3 space-y-2.5">
            <button
              type="button"
              data-role-display="inline-flex"
              class="teacher-only hidden ops-board-rail-action inline-flex w-full justify-center items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg border border-cyan-200 bg-cyan-50 text-cyan-700 hover:bg-cyan-100"
              onclick="globalThis.openTeacherAttendanceQrModal()"
            >
              <i data-lucide="scan-line" class="w-3.5 h-3.5"></i>
              Quét QR chấm công
            </button>

            <div class="space-y-1.5 ops-board-rail-field">
              <div class="text-[11px] font-bold uppercase text-slate-500 ops-rail-field-label">
                Tuần hiển thị
              </div>
              <div
                data-control-trigger="filterWeek"
                class="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 cursor-pointer"
              >
                <i data-lucide="filter" class="w-4 h-4 text-slate-400"></i>
                <input
                  type="week"
                  id="filterWeek"
                  class="text-sm bg-transparent focus:outline-none font-bold text-indigo-700 cursor-pointer w-full"
                />
              </div>
            </div>

            <div class="space-y-1.5 ops-board-rail-field">
              <div class="text-[11px] font-bold uppercase text-slate-500 ops-rail-field-label">
                Chế độ xem
              </div>
              <div
                data-control-trigger="scheduleViewMode"
                class="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 cursor-pointer"
              >
                <i data-lucide="layout-template" class="w-4 h-4 text-slate-400"></i>
                <select
                  id="scheduleViewMode"
                  class="text-sm bg-transparent focus:outline-none font-bold text-indigo-700 cursor-pointer w-full"
                >
                  <option value="list">Danh sách</option>
                  <option value="timetable">TKB tuần</option>
                </select>
              </div>
            </div>

            <div class="space-y-1.5 ops-board-rail-field ops-board-rail-field-search">
              <div class="text-[11px] font-bold uppercase text-slate-500 ops-rail-field-label">
                Tìm kiếm ca dạy
              </div>
              <div class="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200">
                <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                <input
                  type="text"
                  id="boardScheduleSearchInput"
                  data-config-placeholder="ui.placeholders.scheduleSearch"
                  placeholder="Tìm lịch theo lớp, giáo viên, môn học..."
                  class="text-sm bg-transparent focus:outline-none text-slate-700 w-full"
                />
              </div>
            </div>
          </div>
        </aside>

        <section class="ops-workspace-main min-h-0">
          <div class="h-full min-h-0 rounded-xl border border-slate-200 bg-white overflow-hidden flex flex-col">
            <div
              id="teacherAttendanceQuickSummary"
              data-role-display="block"
              class="teacher-only hidden border-b border-cyan-200 bg-cyan-50/70 px-4 lg:px-6 py-2.5 text-xs text-cyan-800"
            ></div>
            <div
              id="scheduleApprovalPanel"
              class="hidden border-b border-amber-200 bg-amber-50/70 px-4 lg:px-6 py-3"
            >
              <div
                class="flex flex-col sm:flex-row sm:items-center justify-between gap-2"
              >
                <div>
                  <h3 class="text-sm font-bold text-amber-900">Chờ duyệt lịch dạy</h3>
                  <p
                    class="text-[11px] text-amber-800/80"
                    id="scheduleApprovalSummary"
                  >
                    Theo tuần.
                  </p>
                </div>
                <span
                  id="scheduleApprovalBadge"
                  class="text-[11px] font-bold px-2 py-1 rounded border border-amber-300 bg-white text-amber-800 self-start sm:self-auto"
                  >0</span
                >
              </div>
              <div
                id="scheduleApprovalList"
                class="mt-2 space-y-2 max-h-48 overflow-y-auto custom-scrollbar"
              ></div>
            </div>
            <div
              class="ops-admin-scroll flex-1 overflow-y-auto custom-scrollbar p-3 sm:p-4 lg:p-6 bg-slate-50/60"
              id="scheduleContainer"
            >
              <!-- JS render -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
