<!-- MÀN HÌNH ĐĂNG NHẬP (GOOGLE SSO) -->
<div
  id="loginOverlay"
  class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center p-4 transition-opacity duration-300 hidden opacity-0"
>
  <div
    class="bg-white rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden flex flex-col transform transition-transform scale-95"
    id="loginBox"
  >
    <div class="bg-indigo-600 p-8 text-center relative overflow-hidden">
      <!-- Hiệu ứng trang trí background -->
      <div
        class="absolute -top-10 -right-10 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl"
      ></div>
      <div
        class="absolute -bottom-10 -left-10 w-32 h-32 bg-indigo-400 opacity-20 rounded-full blur-2xl"
      ></div>

      <div
        class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4 backdrop-blur-md border border-white/10 relative z-10"
      >
        <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
      </div>
      <h1
        data-config-text="branding.shortName"
        class="text-2xl font-bold text-white tracking-tight relative z-10"
      >
        EduTopS
      </h1>
      <p
        data-config-text="branding.fullName"
        class="text-indigo-200 text-sm mt-2 relative z-10"
      >
        EduTopS
      </p>
    </div>

    <div class="p-8">
      <div class="space-y-4">
        <p class="text-sm text-slate-500 text-center mb-6 font-medium">
          Sử dụng tài khoản Google (Gmail) được cấp quyền để truy cập hệ thống.
        </p>

        <button
          onclick="window.loginWithGoogle()"
          id="btnGoogleLogin"
          class="w-full bg-white hover:bg-slate-50 text-slate-700 font-bold py-3.5 px-4 border border-slate-200 hover:border-slate-300 rounded-xl transition-all shadow-sm flex items-center justify-center gap-3"
        >
          <!-- Icon Google chuẩn -->
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 15.02 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>
          Đăng nhập bằng Google
        </button>
