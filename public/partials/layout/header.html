<!-- HEADER -->
<header
  class="ops-header-shell border-b border-slate-200 sticky top-0 z-20 shadow-sm shrink-0"
>
  <div
    class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 min-h-16 sm:h-16 py-2 sm:py-0 flex items-center justify-between"
  >
    <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
      <div class="ops-header-brand-chip p-2 rounded-lg shadow-sm">
        <i data-lucide="database" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <h1
          data-config-text="branding.shortName"
          class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight leading-none"
        >
          EduTopS
        </h1>
        <p
          data-config-text="branding.fullName"
          class="hidden sm:block text-[11px] text-slate-500 mt-1 leading-none"
        >
          EduTopS
        </p>
        <div class="mt-1 flex items-center gap-1.5 flex-wrap">
          <span
            data-config-text="branding.acronym"
            class="text-[10px] font-bold uppercase tracking-wider text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100 inline-block"
            >ETS</span
          >
          <span
            id="headerAppVersion"
            class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded border border-slate-200 inline-block"
            >v0.0.0</span
          >
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-4">
      <div
        class="ops-top-meta hidden sm:flex items-center gap-2 text-sm font-medium text-slate-600 pr-4"
      >
        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="text-xs text-emerald-600 font-bold mr-2">Online</span>
        <span id="headerUserName">...</span>
        <span
          id="headerRoleBadge"
          class="text-[10px] font-bold uppercase tracking-wider text-slate-500 bg-slate-100 px-2 py-0.5 rounded border border-slate-200"
          >Đang xác thực...</span
        >
      </div>
      <button
        onclick="window.logoutFirebase()"
        class="text-slate-500 hover:text-red-600 transition-colors flex items-center gap-1.5 text-sm font-medium px-2.5 py-2 rounded-lg border border-transparent hover:border-red-200 hover:bg-red-50"
      >
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Đăng xuất</span>
      </button>
    </div>
  </div>

  <div class="ops-nav-wrap border-b border-slate-200" id="navTabsContainer">
    <div
      class="ops-nav-track max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 hide-scroll whitespace-nowrap scroll-px-4 sm:scroll-px-6"
    >
      <button
        onclick="window.switchTab('board')"
        id="tabBtn_board"
        class="nav-tab-btn nav-tab-btn-active"
      >
        <i data-lucide="calendar" class="w-4 h-4"></i> 1. Lịch dạy
      </button>
      <button
        onclick="window.switchTab('form')"
        id="tabBtn_form"
        class="nav-tab-btn nav-tab-btn-inactive"
      >
        <i data-lucide="calendar-plus" class="w-4 h-4"></i> 2. Xếp lịch
      </button>
      <button
        onclick="window.switchTab('master')"
        id="tabBtn_master"
        class="nav-tab-btn nav-tab-btn-inactive admin-only hidden"
      >
        <i data-lucide="layers" class="w-4 h-4"></i> 3. Dữ liệu
      </button>
      <button
        onclick="window.switchTab('attendance')"
        id="tabBtn_attendance"
        class="nav-tab-btn nav-tab-btn-inactive admin-only hidden"
      >
        <i data-lucide="badge-dollar-sign" class="w-4 h-4"></i> 4. Chấm công
      </button>
    </div>
  </div>
</header>
